name: Deploy CodeSaathi to Firebase Hosting
# A push to release/v1-frontend publishes the current site and lesson content.

on:
  push:
    branches:
      - release/v1-frontend
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate Hosting files
        run: |
          test -f firebase.json
          test -f .firebaserc
          test -f public/index.html
          test -f public/styles.css
          test -f public/app.js
          node --check public/app.js
          node --check public/js/i18n.js
          node --check public/js/lessons/lesson-template.js
          node --check public/js/lessons/curriculum-loader.js
          node --check public/sw.js
          node -e "JSON.parse(require('fs').readFileSync('public/content/lesson.schema.json', 'utf8'))"
          node <<'NODE'
          const fs = require('fs');
          const languages = ['en','te','hi','kn','ta','ml','mr','bn','gu','pa','ne','or','ur','sa','as','brx','doi','kok','ks','mai','mni','sat','sd'];
          for (const lang of languages) {
            const file = `public/content/${lang}/foundation/F1.3.json`;
            const lesson = JSON.parse(fs.readFileSync(file, 'utf8'));
            const questions = lesson.assessment?.questions || [];
            if (lesson.id !== `foundation.f1.3.${lang}` || lesson.topicId !== 'F1.3') throw new Error('Wrong lesson identity: ' + lang);
            if (lesson.learningObjectives?.length !== 20) throw new Error('Expected 20 learning objectives: ' + lang);
            if (lesson.stages?.explain?.examples?.length !== 3) throw new Error('Expected 3 code examples: ' + lang);
            if (!lesson.stages?.understand?.concept || !lesson.stages?.practise?.guidedTask || lesson.stages.practise.hints?.length < 4) throw new Error('Missing lesson stage content: ' + lang);
            if (questions.length !== 5 || questions.some(q => !q.options?.includes(q.answer))) throw new Error('Invalid assessment answers: ' + lang);
            if (lesson.stages.explain.examples.some(example => !example.code.includes('\n'))) throw new Error('Code example must contain real line breaks: ' + lang);
            if (lesson.status !== 'draft') throw new Error('Unreviewed lesson must remain draft: ' + lang);
          }
          console.log('F1.3 multilingual structure, assessment, and code formatting checks passed for all 23 languages.');
          NODE
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('public/index.html', 'utf8');
          const i18n = fs.readFileSync('public/js/i18n.js', 'utf8');
          const requiredLanguages = ['en', 'te', 'ml', 'kn', 'ta', 'hi'];
          for (const code of requiredLanguages) {
            if (!html.includes('value="' + code + '"')) throw new Error('Missing language option: ' + code);
          }
          if (html.indexOf('/js/lessons/lesson-template.js') > html.indexOf('/app.js')) {
            throw new Error('Lesson template must load before app.js');
          }
          if (!i18n.includes('codesaathi.language.v1')) throw new Error('Language preference persistence is missing');
          if (!html.includes('languageFallbackNotice')) throw new Error('Honest translation fallback notice is missing');
          const path = require('path');
          for (const file of fs.readdirSync('public/content/en/html').filter(name => name.startsWith('H1.') && name.endsWith('.json'))) {
            const raw = fs.readFileSync(path.join('public/content/en/html', file), 'utf8');
            JSON.parse(raw);
            if ([...raw].some(char => char.codePointAt(0) >= 0x0C00 && char.codePointAt(0) <= 0x0C7F)) {
              throw new Error('Telugu script found in English HTML foundation lesson: ' + file);
            }
          }
          console.log('CodeSaathi Phase 1 foundation checks passed.');
          NODE

      - name: Authenticate to Google Cloud using GitHub OIDC
        uses: google-github-actions/auth@v2
        with:
          project_id: multilingual-learning-52e24
          workload_identity_provider: projects/1061074380401/locations/global/workloadIdentityPools/github-actions-pool/providers/github
          service_account: github-firebase-deployer@multilingual-learning-52e24.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting --project multilingual-learning-52e24 --non-interactive
