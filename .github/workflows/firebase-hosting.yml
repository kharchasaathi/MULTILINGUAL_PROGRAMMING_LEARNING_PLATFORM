name: Deploy CodeSaathi to Firebase Hosting

on:
  push:
    branches:
      - release/v1-frontend
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate Hosting files
        run: |
          test -f firebase.json
          test -f .firebaserc
          test -f public/index.html
          test -f public/styles.css
          test -f public/app.js
          node --check public/app.js

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0.10.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: multilingual-learning-52e24
          channelId: live
