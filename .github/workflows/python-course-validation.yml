name: Python Course Validation

on:
  pull_request:
    branches: [release/v1-frontend]
    paths:
      - "public/content/en/python/**"
      - "public/content/curriculum-index.json"
      - "scripts/validate-python-course.mjs"
      - ".github/workflows/python-course-validation.yml"
  push:
    branches: [content/python-course-expansion]
    paths:
      - "public/content/en/python/**"
      - "public/content/curriculum-index.json"
      - "scripts/validate-python-course.mjs"
      - ".github/workflows/python-course-validation.yml"

permissions:
  contents: read

jobs:
  validate-python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install data-analysis dependencies
        run: python -m pip install --disable-pip-version-check "numpy==2.2.6" "pandas==2.2.3" "matplotlib==3.10.8" "scipy==1.15.3"
      - name: Validate Python lessons and execute examples
        run: node scripts/validate-python-course.mjs
