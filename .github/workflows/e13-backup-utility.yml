name: E13 backup and recovery checks
on:
  pull_request:
  push:
    branches: [docs/project-foundation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mocked-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: bash -n ops/backup/*.sh
      - name: Run mocked security and utility tests
        run: bash ops/backup/test-backup-scripts.sh

  postgres-age-integration:
    # Ubuntu 24.04 provides the PostgreSQL 16 client package in its standard repositories.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install age and PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes age postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - name: Verify PostgreSQL client major version matches service
        run: |
          pg_dump --version
          pg_restore --version
          pg_dump --version | grep -Eq ' 16([.]|$)'
          pg_restore --version | grep -Eq ' 16([.]|$)'
      - name: Run real encrypted backup and restore round trip
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash ops/backup/test-backup-integration.sh

  s3-publisher-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: bash -n ops/backup/*.sh
      - name: Validate replication and lifecycle JSON templates
        run: |
          python3 -m json.tool ops/backup/s3-replication-config.example.json >/dev/null
          python3 -m json.tool ops/backup/s3-lifecycle-incomplete-multipart.example.json >/dev/null
      - name: Run mocked S3 publisher contract tests (no AWS credentials)
        run: bash ops/backup/test-s3-publish.sh
      - name: Run PITR operations and recovery-gate tests
        run: bash ops/backup/test-e13-controls.sh
