name: Publish Python Lessons
on:
  push:
    branches: [release/python-publish-all-lessons]
    paths:
      - "scripts/publish-python-lessons.mjs"
      - ".github/workflows/publish-python-lessons.yml"
permissions:
  contents: write
concurrency:
  group: publish-python-lessons
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/python-publish-all-lessons
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish all indexed English Python lessons
        run: node scripts/publish-python-lessons.mjs
      - name: Commit published lesson metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/content/en/python scripts/validate-python-course.mjs
          if git diff --cached --quiet; then
            echo "All Python lessons are already published."
            exit 0
          fi
          git commit -m "Publish all 284 English Python lessons"
          git push origin HEAD:release/python-publish-all-lessons
